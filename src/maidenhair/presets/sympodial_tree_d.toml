[meta]
name = "Sympodial Tree d (Aono & Kunii)"
description = "Sympodial — r1=0.9 r2=0.8 a1=35 a2=35 (requires parametric engine for full fidelity)"
reference = "ABOP p.59, Figure 2.7d, Table 2.2"

[grammar]
axiom = "A"

[grammar.rules]
A = "F(1)![&(35)B]/(180)[&(35)B]"
B = "F(0.9)![+(35)$B][-(35)$B]"

[params]
step_length = 1.0
radius_start = 0.1
radius_ratio = 0.707
angle_default = 35.0
tropism_weight = 0.1
iterations_default = 8
iterations_max = 12

[display]
leaf_color = "spring-green"
branch_color = "light-brown"
background_color = "forest-night"
