[meta]
name = "Sympodial Tree c (Aono & Kunii)"
description = "Sympodial — r1=0.9 r2=0.8 a1=20 a2=50 (requires parametric engine for full fidelity)"
reference = "ABOP p.59, Figure 2.7c, Table 2.2"

[grammar]
axiom = "A"

[grammar.rules]
A = "F(1)![&(20)B]/(180)[&(50)B]"
B = "F(0.9)![+(20)$B][-(50)$B]"

[params]
step_length = 1.0
radius_start = 0.1
radius_ratio = 0.707
angle_default = 20.0
tropism_weight = 0.1
iterations_default = 8
iterations_max = 12

[display]
leaf_color = "green"
branch_color = "oak"
background_color = "forest-night"
