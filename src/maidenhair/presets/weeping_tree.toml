[meta]
name = "Weeping Tree"
description = "Ternary branching with strong tropism — d1=180 d2=252 a=36"
reference = "ABOP p.60, Figure 2.8d, Table 2.3"

[grammar]
axiom = "!F(4)/(45)A"

[grammar.rules]
A = "!F(1)[&(36)F(1)A]/(180)[&(36)F(1)A]/(252)[&(36)F(1)A]"

[params]
step_length = 1.0
radius_start = 0.12
radius_ratio = 0.65
angle_default = 36.0
tropism_weight = 0.4
iterations_default = 6
iterations_max = 8

[display]
leaf_color = "moss"
branch_color = "dark-bark"
background_color = "forest-night"
