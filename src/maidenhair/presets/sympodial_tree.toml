[meta]
name = "Sympodial Tree"
description = "Tree with branching at each node, no single dominant axis"
reference = "Prusinkiewicz & Lindenmayer 1990, p.59"

[grammar]
axiom = "A"

[grammar.rules]
A = "F(1)![-&(35)/(180)A][+&(35)A]"

[params]
step_length = 1.0
radius_start = 0.1
radius_ratio = 0.7
angle_default = 35.0
tropism_weight = 0.1
iterations_default = 6
iterations_max = 8

[display]
leaf_color = "spring-green"
branch_color = "light-brown"
background_color = "forest-night"
