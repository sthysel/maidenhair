[meta]
name = "Bush D (Saupe)"
description = "Complex multi-variable bush attributed to Saupe"
reference = "Paul Bourke L-System page"

[grammar]
axiom = "VZFFF"

[grammar.rules]
V = "[+++W][---W]YV"
W = "+X[-W]Z"
X = "-W[+X]Z"
Y = "YZ"
Z = "[-FFF][+FFF]F"

[params]
step_length = 1.0
angle_default = 20.0
tropism_weight = 0.0
iterations_default = 7
iterations_max = 10

[display]
leaf_color = "moss"
branch_color = "bark"
background_color = "forest-night"
