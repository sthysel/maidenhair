[meta]
name = "ABOP Plant b"
description = "2D branching, edge-rewriting — Figure 1.24b"
reference = "ABOP p.25, Figure 1.24b"

[grammar]
axiom = "F"

[grammar.rules]
F = "F[+F]F[-F][F]"

[params]
step_length = 1.0
angle_default = 20.0
iterations_default = 5
iterations_max = 6

[display]
leaf_color = "light-green"
branch_color = "walnut"
background_color = "forest-night"
