[meta]
name = "Fractal Plant"
description = "Classic 2D branching plant (ABOP Figure 1.24f)"
reference = "Prusinkiewicz & Lindenmayer 1990, Figure 1.24(f)"

[grammar]
axiom = "F"

[grammar.rules]
F = "FF+[+F-F-F]-[-F+F+F]"

[params]
step_length = 0.5
radius_start = 0.03
radius_ratio = 0.85
angle_default = 22.5
tropism_weight = 0.0
iterations_default = 3
iterations_max = 5

[display]
leaf_color = [90, 185, 55]
branch_color = [145, 100, 48]
background_color = [12, 22, 16]
