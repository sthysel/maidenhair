[meta]
name = "Raceme"
description = "Simple monopodial inflorescence with flowers along a central axis"
reference = "ABOP p.72, Section 3.3.1"

[grammar]
axiom = "A"

[grammar.rules]
A = "F[+~]/(137)A"

[params]
step_length = 0.6
angle_default = 25.0
radius_start = 0.04
radius_ratio = 0.9
tropism_weight = 0.0
iterations_default = 12
iterations_max = 20

[display]
leaf_color = "pink"
branch_color = "green"
background_color = "forest-night"
